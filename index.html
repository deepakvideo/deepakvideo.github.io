<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auto Play YouTube Video</title>
</head>
<body>
  <!-- YouTube embed with autoplay enabled -->
  <iframe width="560" height="315"
    src="https://www.youtube.com/embed/XPS7b0gMLFI?autoplay=1&mute=1"
    title="YouTube video player"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen>
  </iframe>
</body>
</html>
